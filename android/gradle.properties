org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because it fails on this project's
# path: the Kotlin daemon cannot close its incremental caches under a directory
# containing a space ("PSB forged"), aborting :mobile_scanner and
# :shared_preferences_android with
#   "Could not close incremental caches in ...\caches-jvm\jvm\kotlin".
# Full (non-incremental) compilation is slower but builds reliably. Remove this
# if the project is ever moved to a path without spaces.
kotlin.incremental=false
